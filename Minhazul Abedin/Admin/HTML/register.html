<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register &mdash; DoctorConnect</title>
    <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>


<div class="plain-top">
    <div class="inner">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M6 17.5h4.2l2.1-5.4 3.4 9.2 2.4-6 1.6 2.2H26" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>        <span class="logo">DoctorConnect</span>
        <span class="tagline">Online Doctor Appointment Management System</span>
    </div>
</div>
<div class="plain-wrap">


<div class="auth-wrap">
    <div class="card auth-card">
        <h1>Create a patient account</h1>
        <p class="muted">Register to book appointments with our doctors.</p>

        
        <!-- onsubmit="return checkForm()" - the word return is required.
             Without it the browser ignores the false and submits anyway. -->
        <form method="get" action="register.html" onsubmit="return checkForm()">

            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="">
            <span class="field-error"></span>

            <label for="email">Email</label>
            <input type="text" id="email" name="email" value="">
            <span class="field-error"></span>

            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="">
            <span class="field-error"></span>

            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <span class="field-error"></span>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm">
            <span class="field-error"></span>

            <span class="field-error" id="jsError"></span>

            <input type="submit" name="submit" value="Register" class="btn btn-block">
        </form>

        <p class="auth-alt">Already registered? <a href="Login.html">Sign in</a></p>
    </div>
</div>

<script>
// CLIENT-SIDE VALIDATION (JavaScript, runs in the browser).
// This gives instant feedback. The PHP checks above still run on
// the server, because a visitor can switch JavaScript off.
function checkForm() {
    var name    = document.getElementById("full_name").value;
    var email   = document.getElementById("email").value;
    var pass    = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;
    var box     = document.getElementById("jsError");

    if (name == "" || email == "" || pass == "") {
        box.innerHTML = "Please fill in all the fields.";
        return false;        // false stops the form from submitting
    }
    if (pass.length < 4) {
        box.innerHTML = "Password must be at least 4 characters.";
        return false;
    }
    if (pass != confirm) {
        box.innerHTML = "The two passwords do not match.";
        return false;
    }
    return true;             // true lets the form go to the server
}
</script>

        <div class="footer">
            DoctorConnect &middot; CSC 3215 Web Technologies &middot; Group 6, Section F &middot; Summer 2025-26
        </div>

</div><!-- .plain-wrap -->

</body>
</html>
