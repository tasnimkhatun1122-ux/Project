<!-- Static export of the Doctor interface for DoctorConnect.
     The working PHP version of these screens is in ../PHP/. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile &mdash; DoctorConnect</title>
    <link rel="stylesheet" href="../CSS/doctor.css">
</head>
<body>


<div class="shell">
    <nav class="sidebar">
        <a href="doctorDashboard.html" class="brand">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M6 17.5h4.2l2.1-5.4 3.4 9.2 2.4-6 1.6 2.2H26" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>            <span class="logo">DoctorConnect</span>
        </a>

        <div class="nav-label">Menu</div>
        <div class="navlinks">
            <a href="doctorDashboard.html"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Appointments</span></a><a href="doctorProfile.html" class="on"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3v6a5 5 0 0 0 10 0V3"/><path d="M4 3h3M15 3h3"/><path d="M11 14v2a5 5 0 0 0 9 3"/><circle cx="20" cy="17" r="2"/></svg><span>My Profile</span></a>        </div>

        <div class="nav-label">Account</div>
        <div class="navlinks">
            <a href="#"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><span>My Account</span></a>        </div>

        <div class="side-foot">
            <div class="whoami">
                <span class="avatar">SA</span>
                <span>
                    <span class="whoami-name">Dr. Salma Akter</span>
                    <span class="role role-doctor">doctor</span>
                </span>
            </div>
            <a href="#" class="btn-logout"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg> <span>Log out</span></a>
        </div>
    </nav>

    <main class="main">
        <div class="container">


<div class="page-head">
    <div>
        <h1>My profile</h1>
        <p class="muted">Patients see these details when they search for a doctor.</p>
    </div>
</div>



<form method="get" class="card">

    <label>Department</label>
    <p><span class="pill">Cardiology</span>
       <span class="muted-inline">set by the admin</span></p>

    <label for="specialization">Specialization</label>
    <input type="text" id="specialization" name="specialization"
           value="Heart Specialist, MBBS, MD"
           placeholder="e.g. Heart Specialist, MBBS, MD">

    <div class="form-grid">
        <div>
            <label for="consultation_fee">Consultation fee (Tk)</label>
            <input type="number" id="consultation_fee" name="consultation_fee"
                   step="1" min="0" value="800.00">
        </div>
        <div>
            <label for="available_time">Visiting hours</label>
            <input type="text" id="available_time" name="available_time"
                   value="Sun-Thu, 5 PM - 8 PM"
                   placeholder="e.g. Sun-Thu, 5 PM - 8 PM">
        </div>
    </div>

    <label for="room">Room</label>
    <input type="text" id="room" name="room" maxlength="20"
           value="304"
           placeholder="e.g. 304, 3rd floor">

    <input type="submit" name="submit" value="Save changes" class="btn btn-block">

</form>

        <div class="footer">
            DoctorConnect &middot; CSC 3215 Web Technologies &middot; Group 6, Section F &middot; Summer 2025-26
        </div>

        </div><!-- .container -->
    </main>
</div><!-- .shell -->

</body>
</html>
